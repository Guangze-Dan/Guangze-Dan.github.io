<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Panoramic Palace Museum — Browser Recreation</title><style>
html,body{margin:0;background:#111;color:#f7f3e8;font:14px system-ui,sans-serif}body{display:grid;place-items:center;min-height:100vh}.wrap{width:min(1000px,100vw);padding:18px;box-sizing:border-box}canvas{display:block;width:100%;border-radius:14px;border:1px solid #5f573f;background:#000;touch-action:none}.hint{display:flex;justify-content:space-between;gap:12px;color:#c8bc9c;margin-top:10px;font-size:12px}@media(max-width:700px){.hint{display:block;line-height:1.7}}
</style></head><body><div class="wrap"><canvas id="museum" width="800" height="600" tabindex="0"></canvas><div class="hint"><span><b>S</b> enter museum · <b>←/→</b> change hall · click a map icon</span><span>Processing recreation · original archive assets</span></div></div><script>
const c=document.getElementById('museum'),ctx=c.getContext('2d'),W=800,H=600,path='data/';let scene=1,place=0,scroll=0,showMenu=false;
const bg=new Image(),palace=new Image();bg.src=path+'b.jpg';palace.src=path+'Palace.gif';const icons=Array.from({length:8},(_,i)=>{const im=new Image();im.src=path+i+'.png';return im});
const photos=['The Palace Museum.jpg','Hall of Supreme Harmony.png','Hall of Imperial Supremacy.png','Hall of Literary Brilliance.png','Palace of Prolonging Happiness.png','Palace of Compassion and Tranquility.png','Hall of Mental Cultivation.png','Palace of Heavenly Purity.png'];const halls=['The Gate of Palace Museum','The Hall of Supreme Harmony (Taihe Dian)','The Hall of Imperial Supremacy (Huangji Dian)','The Hall of Literary Brilliance (Wenhua Dian)','The Palace of Prolonging Happiness (Yanxi Gong)','The Palace of Compassion and Tranquility (Cining Gong)','The Hall of Mental Cultivation (Yangxin Dian)','The Palace of Heavenly Purity (Qianqing Gong)'];const copy=[
'The Palace Museum is open Tuesday through Sunday. Temporary closures may occur.',
'The Hall of Supreme Harmony is the most dignified building in the Forbidden City. Its name reflects the ideal of universal harmony under heaven.',
'The Hall of Imperial Supremacy belongs to the Palace of Tranquil Longevity and now forms part of the Treasure Gallery.',
'The Hall of Literary Brilliance lies east of the Hall of Supreme Harmony and was once the residence of the heir apparent.',
'The Palace of Prolonging Happiness was rebuilt as a research centre for traditional calligraphy, paintings and ceramics.',
'The Palace of Compassion and Tranquility was built as a residence for the Empress Dowager and rebuilt during the Qianlong reign.',
'The Hall of Mental Cultivation was used for daily government affairs, memoranda and meetings with officials.',
'The Palace of Heavenly Purity was the principal imperial residence and later became part of the palace ritual route.'
];
function drawImage(im,x,y,w,h){if(im.complete&&im.naturalWidth)ctx.drawImage(im,x,y,w,h)}function cover(im,x,y,w,h){if(!im.complete||!im.naturalWidth)return;const s=Math.max(w/im.naturalWidth,h/im.naturalHeight),nw=im.naturalWidth*s,nh=im.naturalHeight*s;ctx.drawImage(im,x+(w-nw)/2,y+(h-nh)/2,nw,nh)}
function start(){cover(bg,-scroll,0,W,H);cover(bg,W-scroll,0,W,H);scroll=(scroll+1.5)%W;ctx.fillStyle='#0005';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#ffc143';ctx.font='25px Georgia';ctx.fillText("Press 'S' To Start",400,120);ctx.textAlign='left';ctx.fillStyle='#f5f5f5';ctx.font='17px Georgia';wrap(copy[0],180,160,600,30,7);}
function map(){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#f0df24';ctx.font='40px Georgia';ctx.fillText('THE PALACE MUSEUM',400,50);ctx.textAlign='left';drawImage(palace,30,80,150,150);cover(new Image(),0,0,0,0);ctx.fillStyle='#f5f2e8';ctx.font='16px system-ui';ctx.fillText('Select a place to enter the archive',230,90);const spots=[[389,559],[401,466],[400,371],[78,395],[76,491],[615,403],[612,504],[697,458]];if(showMenu){ctx.fillStyle='#ffffffcc';ctx.fillRect(0,300,W,300);spots.forEach((p,i)=>{drawImage(icons[i],p[0]-50,p[1]-50,100,100);ctx.fillStyle='#9e0a0a';ctx.font='12px system-ui';ctx.fillText(halls[i].replace('The ','').slice(0,20),p[0]-48,p[1]+66)})}}
function detail(){const im=new Image();im.src=path+photos[place];cover(im,0,0,W,H);ctx.fillStyle='#f2eed7cc';ctx.fillRect(220,70,560,460);ctx.fillStyle='#111';ctx.textAlign='left';ctx.font='22px Georgia';ctx.fillText('You are '+halls[place],245,110);ctx.font='16px Georgia';wrap(copy[place],245,155,500,28,12);ctx.fillStyle='#f0df24';ctx.font='14px system-ui';ctx.fillText('← / → change place · click lower half to open map',245,560)}
function wrap(text,x,y,max,line,rows){const words=text.split(' ');let lineText='';for(const word of words){const test=lineText+word+' ';if(ctx.measureText(test).width>max&&lineText){ctx.fillText(lineText,x,y);lineText=word+' ';y+=line}else lineText=test}if(lineText)ctx.fillText(lineText,x,y)}
function draw(){ctx.clearRect(0,0,W,H);if(scene===1)start();else if(showMenu||scene===2)map();else detail();requestAnimationFrame(draw)}
c.addEventListener('mousemove',e=>{showMenu=scene===2&&e.offsetY>300});c.addEventListener('click',e=>{if(scene===1)return;if(scene===2&&e.offsetY>300){const spots=[[389,559],[401,466],[400,371],[78,395],[76,491],[615,403],[612,504],[697,458]];let best=-1,dist=Infinity;spots.forEach((p,i)=>{const d=Math.hypot(e.offsetX-p[0],e.offsetY-p[1]);if(d<dist){dist=d;best=i}});if(dist<70){place=best;scene=3;showMenu=false}}else if(scene===3&&e.offsetY>300){scene=2;showMenu=true}});
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='s'&&scene===1){scene=2;return}if(e.key==='ArrowRight'){place=Math.min(7,place+1);if(scene!==1)scene=3}if(e.key==='ArrowLeft'){place=Math.max(0,place-1);if(scene!==1)scene=3}if(e.key==='Escape'){scene=2;showMenu=true}});draw();c.focus();
</script></body></html>
