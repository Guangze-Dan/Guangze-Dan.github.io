<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Leave us some advice</title>
	<style>
		body {
			display: flex;
			flex-direction: column;
			align-items: center;
			margin: 0;
			padding: 0;
			min-height: 100vh;
			font-family: Arial, sans-serif;
			font-size: 16px;
			line-height: 1.5;
			background-color: #f5f5f5;
		}

		header {
			display: flex;
			justify-content: center;
			align-items: center;
			width: 100%;
			height: 80px;
			background-color: rgb(51, 79, 43);
			color: #fff;
			font-size: 24px;
			font-weight: bold;
			text-align: center;
		}

		main {
			display: flex;
			flex-direction: column;
			align-items: center;
			width: 100%;
			flex: 1;
			padding: 20px;
			box-sizing: border-box;
		}

		form {
			display: flex;
			flex-direction: column;
			align-items: center;
			width: 100%;
			max-width: 600px;
			margin-bottom: 20px;
			background-color: #fff;
			padding: 20px;
			box-shadow: 0 0 10px rgba(43, 167, 93, 0.1);
			border-radius: 5px;
			box-sizing: border-box;
		}

		label {
			display: block;
			margin-bottom: 10px;
			font-weight: bold;
		}

		input[type="text"],
		textarea {
			display: block;
			width: 100%;
			padding: 10px;
			margin-bottom: 20px;
			border: 1px solid #ccc;
			border-radius: 5px;
			box-sizing: border-box;
			font-size: 16px;
			line-height: 1.5;
		}

		button[type="button"] {
			display: block;
			margin: 0 auto;
			padding: 5px 20px;
			background-color: rgb(64, 178, 64);
			color: #fff;
			border: none;
			border-radius: 5px;
			font-size: 16px;
			cursor: pointer;
            text-decoration: none;
		}

		hr {
			width: 100%;
			margin: 20px 0;
			border: none;
			border-top: 1px solid #ccc;
		}

		ul {
			list-style: none;
			padding: 0;
			margin: 0;
			width: 100%;
			max-width: 600px;
			background-color: #fff;
			box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
			border-radius: 5px;
			box-sizing: border-box;
		}

		li {
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 10px 20px;
			border-bottom: 1px solid #ccc;
			font-size: 16px;
			line-height: 1.5;
		}

		li:last-child {
			border-bottom: none;
		}

		li span:first-child {
			flex: 1;
		}

		li span:last-child {
			margin-left: 20px;
			color: #999;
			font-size: 14px;
		}
        
        /* Media queries for responsiveness */
        @media only screen and (max-width: 1280px) {
            header {
                height: 60px;
                font-size: 20px;
            }
            form {
                max-width: 90%;
            }
            ul {
                max-width: 90%;
            }
        }
       
 
  #buttonGroup {
    display: flex;
    justify-content: space-between;
    margin-top: 1em;
    margin-bottom: 1em;
  }
  #buttonGroup button {
    margin-right: 1em;
  }

	</style>
</head>
<body>
	<header>Leave us some advice</header>
	<main>
		<form>
			<label for="name">Name：</label>
			<input type="text" id="name" required>
			<label for="message">Comment：</label>
			<textarea id="message" required></textarea>
			<div id="buttonGroup">
                <a href="restaurant.html"><button type="button">Return</button></a>
                <button type="button" onclick="addMessage()">Submit</button>
              </div>
		</form>
		<hr>
		<h2>List</h2>
        <button type="button" onclick="deleteMessages()">Clear all</button>
		<ul id="messageList">
			<!-- Set the Initial place  -->
		</ul>
        
	</main>
	<script>
		// Read localstorage messages
		var messages = JSON.parse(localStorage.getItem("messages")) || [];

		// Update
		function updateMessageList() {
			var messageList = document.getElementById("messageList");
			messageList.innerHTML = "";
			for (var i = 0; i < messages.length; i++) {
				var message = messages[i];
				var li = document.createElement("li");

				// Name and contents
				var messageText = document.createElement("span");
				messageText.textContent = message.name + "：" + message.message + "  ";

				// Time
				var messageTime = document.createElement("span");
				messageTime.textContent = "[" + new Date(message.timestamp).toLocaleString() + "]";

				li.appendChild(messageText);
				li.appendChild(messageTime);
				messageList.appendChild(li);
			}
		}

		// Add
		function addMessage() {
			var name = document.getElementById("name").value.trim();
			var message = document.getElementById("message").value.trim();
			if (name && message) {
				var timestamp = Date.now();  // record time
				messages.push({name: name, message: message, timestamp: timestamp});
				localStorage.setItem("messages", JSON.stringify(messages));
				updateMessageList();
				document.getElementById("name").value = "";
				document.getElementById("message").value = "";
			}
		}
        function deleteMessages() {
    messages = [];
    localStorage.setItem("messages", JSON.stringify(messages));
    updateMessageList();
}

		// Initialize the list
		updateMessageList();
	</script>
</body>
<footer><a href="#" onclick="alert('You are at the -Comments- page.'); return false;">Which page am I now?</a></footer>
</html>
