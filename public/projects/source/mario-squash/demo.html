<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mario Squash — Browser Recreation</title><style>
html,body{margin:0;background:#101116;color:#f5f4ef;font:14px system-ui,sans-serif}body{display:grid;place-items:center;min-height:100vh}.wrap{width:min(1100px,100vw);padding:18px;box-sizing:border-box}canvas{display:block;width:100%;border:1px solid #49506c;border-radius:14px;background:#1d2234;image-rendering:auto;touch-action:none}.hint{display:flex;justify-content:space-between;gap:12px;color:#aeb2c5;margin-top:10px;font-size:12px}.hint b{color:#f8c24b}@media(max-width:700px){.hint{display:block;line-height:1.7}}
</style></head><body><div class="wrap"><canvas id="game" width="1800" height="900" tabindex="0"></canvas><div class="hint"><span><b>P1</b> W/A/S/D · <b>P2</b> ↑/←/↓/→ · menu: S/↓ choose · N normal / L low speed · R restart</span><span>Processing recreation · first press N or L to start</span></div></div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),W=1800,H=900,keys=new Set();
const path='data/';const assets={bg:'gameBgImage.png',entry:'entry.jpg',p1:'mario1.gif',p2:'mario2.gif',luigi1:'luigi1.gif',luigi2:'luigi2.gif',koopa1:'Koopa_standby1.gif',koopa2:'Koopa_standby2.gif',cand1:'Candidate1.gif',cand2:'Candidate2.gif',koopaCand:'Koopa_candidate.gif',ball:'mushroomball.gif',hit1:'hit1.gif',hit2:'hit2.gif',jump1:'jump1.gif',jump2:'jump2.gif',p1hitball:'mariohit.gif',p2hitball:'mariohit.gif',bigMario:'bigmario.gif',bigMarioJump:'bigmariojump.gif',bigMarioHit:'bigmariohit.gif',bigLuigi:'bigluigi1.gif',bigKoopa:'bigKoopa_standby1.gif',lose1:'LOSE1.gif',lose2:'LOSE2.gif'};
const img={};Object.entries(assets).forEach(([k,v])=>{img[k]=new Image();img[k].src=path+v});
let state='menu',speed=15,score1=0,score2=0,selector1=1,selector2=1,chosen1=1,chosen2=1,win='';let p1={x:0,y:700,vy:0,down:false},p2={x:1600,y:700,vy:0,down:false},ball={x:100,y:0,vx:0,vy:10,hit:false,who:0};
addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();handleKey(e.key)});addEventListener('keyup',e=>{keys.delete(e.key.toLowerCase());if(e.key.toLowerCase()==='s')p1.down=false;if(e.key==='ArrowDown')p2.down=false});
function handleKey(k){const q=k.toLowerCase();if(state==='menu'){if(q==='n'||q==='l'){state='game';speed=q==='n'?15:10;chosen1=selector1;chosen2=selector2;resetRound(true)}if(q==='s')selector1=selector1%3+1;if(q==='arrowdown')selector2=selector2%3+1;return}if(state==='win'&&q==='r'){state='menu';win='';return}if(q==='r'){score1=score2=0;resetRound(true)}}
function sprite(side,kind,big=false){const n=side===1?chosen1:chosen2;if(big){return n===1?img.bigMario:n===2?img.bigLuigi:img.bigKoopa}if(kind==='jump')return side===1?(n===1?img.jump1:n===2?img.luigi1:img.koopa1):(n===1?img.jump2:n===2?img.luigi2:img.koopa2);if(kind==='hit')return side===1?img.hit1:img.hit2;return side===1?(n===1?img.p1:n===2?img.luigi1:img.koopa1):(n===1?img.p2:n===2?img.luigi2:img.koopa2)}
function drawImageSafe(im,x,y,w,h){if(im.complete&&im.naturalWidth)ctx.drawImage(im,x,y,w,h)}
function menu(){if(img.entry.complete)ctx.drawImage(img.entry,0,0,W,H);ctx.fillStyle='#0009';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fcae03';ctx.font='150px Georgia';ctx.fillText('Mario',550,150);ctx.fillText('Squash',550,300);ctx.fillStyle='#f8fac2';ctx.font='80px system-ui';ctx.fillText('Player 1',255,400);ctx.fillText('Player 2',1200,400);drawImageSafe(selector1===1?img.cand1:selector1===2?img.cand2:img.koopaCand,205,450,400,400);drawImageSafe(selector2===1?img.cand1:selector2===2?img.cand2:img.koopaCand,1150,450,400,400);ctx.fillStyle='#f8c24b';ctx.font='30px system-ui';ctx.fillText('Q: change P1',220,850);ctx.fillText('P: change P2',1200,850);ctx.fillText('Press N to Start Normal Speed',650,650);ctx.fillText('Press L to Start Low Speed',680,750)}
function updatePlayer(p,left,right,jump,hit,side){if(keys.has(left))p.x-=10;if(keys.has(right))p.x+=10;if(keys.has(jump)&&p.y===700)p.vy=-30;if(keys.has(hit))p.down=true;p.vy+=.98;p.y+=p.vy;if(p.y>700){p.y=700;p.vy=0}p.x=Math.max(side===1?0:900,Math.min(side===1?700:1600,p.x))}
function resetRound(first=false){p1={x:0,y:700,vy:0,down:false};p2={x:1600,y:700,vy:0,down:false};ball={x:first?100:(ball.x<W/2?1600:100),y:0,vx:0,vy:10,hit:false,who:0}}
function score(){if(ball.x<W/2)score2++;else score1++;if(score1>=10){state='win';win='P1win'}else if(score2>=10){state='win';win='P2win'}else{if(score1===5||score2===5){}resetRound()}}
function game(){drawImageSafe(img.bg,0,0,W,H);updatePlayer(p1,'a','d','w','s',1);updatePlayer(p2,'arrowleft','arrowright','arrowup','arrowdown',2);if(score1===5||score2===5){drawImageSafe(sprite(1,'stand',true),p1.x,p1.y,200,200);drawImageSafe(sprite(2,'stand',true),p2.x,p2.y,200,200)}else{drawImageSafe(sprite(1,p1.down?'hit':p1.y<700?'jump':'stand'),p1.x,p1.y,200,200);drawImageSafe(sprite(2,p2.down?'hit':p2.y<700?'jump':'stand'),p2.x,p2.y,200,200)}ball.x+=ball.vx;ball.y+=ball.vy;ball.vy+=.98;if(ball.x<0||ball.x>W-180)ball.vx*=-1;if(ball.y<0)ball.vy*=-1;if(ball.y>H){score();return}const hit=(p,side)=>Math.hypot(ball.x-(p.x+100),ball.y-(p.y+100))<150;if(hit(p1,1)){const dx=ball.x-(p1.x+100),dy=ball.y-(p1.y+100),m=Math.hypot(dx,dy)||1;ball.vx=dx/m*speed;ball.vy=dy/m*speed;ball.hit=p1.down;ball.who=1}if(hit(p2,2)){const dx=ball.x-(p2.x+100),dy=ball.y-(p2.y+100),m=Math.hypot(dx,dy)||1;ball.vx=dx/m*speed;ball.vy=dy/m*speed;ball.hit=p2.down;ball.who=2}drawImageSafe(ball.hit?(ball.who===1?img.p1hitball:img.p2hitball):img.ball,ball.x,ball.y,180,142);ctx.fillStyle='#bf7245';ctx.font='100px Georgia';ctx.fillText(score1,100,100);ctx.fillText(score2,1690,100)}
function winScreen(){drawImageSafe(img.entry,0,0,W,H);ctx.fillStyle='#0008';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fcae03';ctx.font='150px Georgia';ctx.fillText(win,650,250);drawImageSafe(win==='P1win'?img.lose1:img.lose2,700,450,500,320);ctx.fillStyle='#f8fac2';ctx.font='32px system-ui';ctx.fillText('Press R to return to the menu',650,820)}
function loop(){ctx.clearRect(0,0,W,H);if(state==='menu')menu();else if(state==='game')game();else winScreen();requestAnimationFrame(loop)}loop();c.focus();
</script></body></html>
